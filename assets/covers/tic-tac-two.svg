<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" aria-hidden="true">
  <!-- 5x5 grid, cell 36px; board 180x180 centered in 320x200 -->
  <rect width="320" height="200" fill="#e8e2d6"/>
  <g stroke="#c9c2b4" stroke-width="1.25">
    <line x1="70" y1="10" x2="70" y2="190"/><line x1="106" y1="10" x2="106" y2="190"/>
    <line x1="142" y1="10" x2="142" y2="190"/><line x1="178" y1="10" x2="178" y2="190"/>
    <line x1="214" y1="10" x2="214" y2="190"/><line x1="250" y1="10" x2="250" y2="190"/>
    <line x1="70" y1="10" x2="250" y2="10"/><line x1="70" y1="46" x2="250" y2="46"/>
    <line x1="70" y1="82" x2="250" y2="82"/><line x1="70" y1="118" x2="250" y2="118"/>
    <line x1="70" y1="154" x2="250" y2="154"/><line x1="70" y1="190" x2="250" y2="190"/>
  </g>
  <!-- 3x3 window: cols 1-3, rows 1-3 (between grid lines at 106,214 and 46,154) -->
  <rect x="106" y="46" width="108" height="108" rx="2" stroke="#2d4a3e" stroke-width="4" fill="none"/>
  <!-- Cell center: (70 + col*36 + 18, 10 + row*36 + 18); row 2 col 1 and col 3 -->
  <text x="124" y="100" text-anchor="middle" dominant-baseline="central"
    font-family="Georgia,serif" font-size="26" fill="#1c1914" font-weight="600">&#215;</text>
  <circle cx="196" cy="100" r="12" stroke="#2d4a3e" stroke-width="3" fill="none"/>
</svg>
